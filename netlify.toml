[build]
  command = "CI= npm run build"
  publish = "build"
  base = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "16.20.0"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"
  REACT_APP_SITE_URL = "https://nasir-mirza-portfolio.netlify.app"
  NODE_ENV = "production"

[dev]
  command = "npm start"
  port = 3000
  publish = "build"
  framework = "#create-react-app"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[functions]
  directory = "functions"

[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' formsubmit.co; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' fonts.gstatic.com;"